name: GPO Automated 12-Hour Market Pricing & Forecasts

on:
  schedule:
    # Runs autonomously in GitHub Cloud every 12 hours
    - cron: '0 */12 * * *'
  workflow_dispatch:
    # Allows manual instant triggering from the Actions tab

permissions:
  contents: write

concurrency:
  group: gpo-price-updates
  cancel-in-progress: true

jobs:
  update-market-values:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run Market Analysis & Pricing Engine
        env:
          DISCORD_TOKEN: ${{ secrets.DISCORD_TOKEN }}
          DISCORD_CHANNEL_IDS: ${{ secrets.DISCORD_CHANNEL_IDS }}
        run: |
          python scripts/update_values.py

      - name: Commit and Push Changes
        run: |
          git config --local user.email "bot@gpovalues.com"
          git config --local user.name "GPO Autonomous Value Bot"
          if [[ -n $(git status -s) ]]; then
            echo "Changes detected! Staging and committing..."
            git add data/values.json data/trade_aliases.json gpo_items.json items_data.js
            git commit -m "📈 Auto-update market values & forecasts [$(date -u +'%Y-%m-%d %H:%M UTC')]"
            git push origin main
          else
            echo "No market price changes detected. Database is up to date."
          fi
